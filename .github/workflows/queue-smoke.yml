name: Offline Queue Smoke Tests

on:
  pull_request:
    paths:
      - 'src/lib/db.ts'
      - 'src/lib/response.ts'
      - 'src/lib/config.ts'
      - 'src/lib/invoke.ts'
      - 'src/lib/provider-policy.ts'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/queue-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:main
      - name: Credential-free queue and attachment checks
        env:
          NODE_ENV: test
        run: node --test tests/queue-smoke.test.cjs tests/provider-boundary.test.cjs tests/queue-burst.test.cjs tests/provider-command-limits.test.cjs
