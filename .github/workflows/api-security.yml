name: TinyClaw local API guard

on:
  pull_request:
    paths:
      - 'src/server/index.ts'
      - 'src/server/security.ts'
      - 'tests/api-security.test.cjs'
      - '.github/workflows/api-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-and-bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local API policy tests
        run: node --experimental-strip-types --test tests/api-security.test.cjs
      - name: Install dependencies without postinstall/browser downloads
        run: npm ci --ignore-scripts
      - name: TypeScript build
        run: npm run build
